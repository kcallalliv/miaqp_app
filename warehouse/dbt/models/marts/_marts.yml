version: 2

models:
  - name: dim_product
    description: "Dimensión de productos con atributos deportivos."
    columns:
      - name: product_id
        tests: [unique, not_null]
  - name: dim_customer
    description: "Dimensión de clientes con recencia y recompra."
    columns:
      - name: customer_id
        tests: [unique, not_null]
  - name: dim_date
    columns:
      - name: date
        tests: [unique, not_null]
  - name: fct_orders
    description: "Hechos de órdenes (grano: orden)."
    columns:
      - name: order_id
        tests: [unique, not_null]
  - name: fct_order_items
    description: "Hechos de líneas de orden (grano: línea)."
    columns:
      - name: order_item_id
        tests: [unique, not_null]
  - name: mart_sales_by_sport
    description: "Ventas agregadas por deporte y fecha."
  - name: mart_funnel
    description: "Embudo de conversión por sesión y fecha."
  - name: mart_cart_abandonment
    description: "Carritos abandonados por deporte/marca/producto."
